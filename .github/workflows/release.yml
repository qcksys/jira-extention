name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Create Release PR or tag release
        id: changesets
        uses: changesets/action@v1
        with:
          version: node_modules/.bin/changeset version
          publish: node_modules/.bin/changeset tag
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect release tag
        id: tag
        run: |
          TAG=$(git tag --points-at HEAD | head -n 1)
          if [ -n "$TAG" ]; then
              # Strip either the `@scope/name@` prefix (monorepo) or the leading `v` (single package)
              VERSION="${TAG##*@}"
              VERSION="${VERSION#v}"
              echo "name=$TAG" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build extension zips
        if: steps.tag.outputs.name
        run: |
          vp run zip
          vp run zip:firefox

      - name: Extract release notes
        if: steps.tag.outputs.name
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          awk -v ver="## ${VERSION}" '
              $0 == ver { found=1; next }
              found && /^## / { exit }
              found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Fall back to auto-generated notes if the section is empty
          if [ ! -s RELEASE_NOTES.md ]; then
              echo "Release v${VERSION}" > RELEASE_NOTES.md
          fi

      - name: Create or update GitHub Release
        if: steps.tag.outputs.name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "v${VERSION}" --notes-file RELEASE_NOTES.md
              gh release upload "$TAG" .output/*.zip --clobber
          else
              gh release create "$TAG" \
                  --title "v${VERSION}" \
                  --notes-file RELEASE_NOTES.md \
                  .output/*.zip
          fi
